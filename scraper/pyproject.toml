[project]
name = "maeve-scraper"
version = "0.1.0"
description = "Scrapling JSON-lines sidecar for Maeve"
readme = "README.md"
authors = [
    { name = "ARKye03", email = "rafa03-dev@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "scrapling[fetchers]>=0.5.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
