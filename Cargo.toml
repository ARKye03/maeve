[package]
name = "maeve"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
iced = "0.14.0"
jiff = { version = "0.2.43", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"
