[package]
name = "maeve"
version = "0.1.0"
edition = "2024"
description = "Compare Mercado Libre and TEMU listings by landed cost"

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["tokio", "image", "canvas"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
jiff = { version = "0.2.43", features = ["serde"] }
keyring = { version = "3", default-features = false, features = ["apple-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
turso = "0.8"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

[package.metadata.bundle]
name = "Maeve"
identifier = "uy.maeve.app"
icon = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/256x256.png", "assets/icons/512x512.png", "assets/icons/512x512@2x.png", "assets/icons/maeve.icns"]
resources = ["scraper/pyproject.toml", "scraper/uv.lock", "scraper/.python-version", "scraper/README.md", "scraper/maeve_scraper/**/*.py"]
category = "Utility"
short_description = "Compare Mercado Libre and TEMU listings by landed cost"
osx_minimum_system_version = "11.0"
